<!doctype html>
<html>
    <head>
        <script type="module">
            window.process = { env: {} };
            window.__swc = { warn: () => {} };
        </script>
        <title>mas-country-picker unit tests</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="../src/swc.js" type="module"></script>
        <script type="module">
            import { runTests } from '@web/test-runner-mocha';
            import { expect } from '@esm-bundle/chai';
            import { initElementFromTemplate, oneEvent } from './utils.js';
            import '../src/mas-country-picker.js';

            runTests(async () => {
                describe('mas-country-picker', () => {
                    describe('parse countries attribute', () => {
                        it('parses comma-separated string into uppercase array', async function () {
                            const el = initElementFromTemplate('withCountries', this.test.title);
                            await el.updateComplete;
                            expect(el.selectedCountries).to.deep.equal(['KR', 'JP']);
                        });

                        it('trims whitespace and uppercases each code', async function () {
                            const el = initElementFromTemplate('withWhitespace', this.test.title);
                            await el.updateComplete;
                            expect(el.selectedCountries).to.deep.equal(['US', 'DE']);
                        });

                        it('returns empty array when countries attribute is empty', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;
                            expect(el.selectedCountries).to.deep.equal([]);
                        });
                    });

                    describe('trigger label', () => {
                        it('shows selectionLabel as placeholder when no countries selected', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;
                            const label = el.shadowRoot.querySelector('.selection-trigger-label');
                            expect(label.textContent.trim()).to.equal('Select countries');
                            expect(label.classList.contains('is-placeholder')).to.be.true;
                        });

                        it('shows emptySelectionLabel as placeholder when set and no countries selected', async function () {
                            const el = initElementFromTemplate('withEmptyLabel', this.test.title);
                            await el.updateComplete;
                            const label = el.shadowRoot.querySelector('.selection-trigger-label');
                            expect(label.textContent.trim()).to.equal('All countries');
                            expect(label.classList.contains('is-placeholder')).to.be.true;
                        });

                        it('removes placeholder class when countries are selected', async function () {
                            const el = initElementFromTemplate('withCountries', this.test.title);
                            await el.updateComplete;
                            const label = el.shadowRoot.querySelector('.selection-trigger-label');
                            expect(label.classList.contains('is-placeholder')).to.be.false;
                            expect(label.textContent).to.include('KR');
                        });

                        it('treats empty selection as a real value when empty-selection-is-value is set', async function () {
                            const el = initElementFromTemplate('emptySelectionIsValue', this.test.title);
                            await el.updateComplete;
                            const label = el.shadowRoot.querySelector('.selection-trigger-label');
                            expect(label.textContent.trim()).to.equal('All countries');
                            expect(label.classList.contains('is-placeholder')).to.be.false;
                        });
                    });

                    describe('disabled state', () => {
                        it('does not open dialog when disabled', async function () {
                            const el = initElementFromTemplate('disabled', this.test.title);
                            await el.updateComplete;
                            const trigger = el.shadowRoot.querySelector('.selection-trigger');
                            trigger.click();
                            await el.updateComplete;
                            expect(el.dialogOpen).to.be.false;
                            expect(el.shadowRoot.querySelector('sp-dialog')).to.not.exist;
                        });
                    });

                    describe('dialog open / cancel', () => {
                        it('opens dialog and pre-populates temp selection on trigger click', async function () {
                            const el = initElementFromTemplate('withCountries', this.test.title);
                            await el.updateComplete;
                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;
                            expect(el.dialogOpen).to.be.true;
                            expect(el.shadowRoot.querySelector('sp-dialog.selection-dialog')).to.exist;
                            expect(el.tempSelectedCountries).to.deep.equal(['KR', 'JP']);
                        });

                        it('closes dialog and discards temp selection on cancel', async function () {
                            const el = initElementFromTemplate('withCountries', this.test.title);
                            await el.updateComplete;
                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;

                            const cancelButton = [...el.shadowRoot.querySelectorAll('sp-button[slot="button"]')].find(
                                (b) => b.textContent.trim() === 'Cancel',
                            );
                            cancelButton.click();
                            await el.updateComplete;

                            expect(el.dialogOpen).to.be.false;
                            expect(el.tempSelectedCountries).to.deep.equal([]);
                            expect(el.selectedCountries).to.deep.equal(['KR', 'JP']);
                        });
                    });

                    describe('search / filter', () => {
                        it('filters checkboxes by country code', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;
                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;

                            el.searchQuery = 'KR';
                            await el.updateComplete;

                            const checkboxes = el.shadowRoot.querySelectorAll('.checkbox-list sp-checkbox');
                            const codes = [...checkboxes].map((c) => c.getAttribute('value'));
                            expect(codes).to.include('KR');
                            expect(codes.length).to.be.lessThan(10);
                        });

                        it('filters checkboxes by country name (case-insensitive)', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;
                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;

                            el.searchQuery = 'united states';
                            await el.updateComplete;

                            const checkboxes = el.shadowRoot.querySelectorAll('.checkbox-list sp-checkbox');
                            expect(checkboxes.length).to.be.greaterThan(0);
                            const codes = [...checkboxes].map((c) => c.getAttribute('value'));
                            expect(codes).to.include('US');
                        });

                        it('shows all countries when search query is cleared', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;
                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;

                            el.searchQuery = 'KR';
                            await el.updateComplete;
                            el.searchQuery = '';
                            await el.updateComplete;

                            const checkboxes = el.shadowRoot.querySelectorAll('.checkbox-list sp-checkbox');
                            expect(checkboxes.length).to.be.greaterThan(1);
                        });
                    });

                    describe('select-all', () => {
                        it('selects all filtered countries when select-all is checked', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;
                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;

                            el.searchQuery = 'KR';
                            await el.updateComplete;

                            const selectAll = el.shadowRoot.querySelector('.selection-controls sp-checkbox[value="all"]');
                            selectAll.checked = true;
                            selectAll.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                            await el.updateComplete;

                            expect(el.tempSelectedCountries).to.include('KR');
                        });

                        it('deselects all filtered countries when select-all is unchecked', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;
                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;

                            el.searchQuery = 'KR';
                            await el.updateComplete;

                            const selectAll = el.shadowRoot.querySelector('.selection-controls sp-checkbox[value="all"]');
                            selectAll.checked = true;
                            selectAll.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                            await el.updateComplete;

                            selectAll.checked = false;
                            selectAll.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                            await el.updateComplete;

                            expect(el.tempSelectedCountries).to.not.include('KR');
                        });

                        it('shows selection count label', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;
                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;

                            const countLabel = el.shadowRoot.querySelector('.selection-count');
                            expect(countLabel.textContent.trim()).to.equal('0 countries selected');

                            el.tempSelectedCountries = ['KR'];
                            await el.updateComplete;
                            expect(countLabel.textContent.trim()).to.equal('1 country selected');

                            el.tempSelectedCountries = ['KR', 'JP'];
                            await el.updateComplete;
                            expect(countLabel.textContent.trim()).to.equal('2 countries selected');
                        });
                    });

                    describe('apply', () => {
                        it('dispatches countries-changed event with selected countries on apply', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;
                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;

                            const krCheckbox = el.shadowRoot.querySelector('sp-checkbox[value="KR"]');
                            krCheckbox.checked = true;
                            krCheckbox.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                            await el.updateComplete;

                            const eventPromise = oneEvent(el, 'countries-changed');
                            const applyButton = [...el.shadowRoot.querySelectorAll('sp-button[slot="button"]')].find(
                                (b) => b.textContent.trim() === 'Apply',
                            );
                            applyButton.click();
                            const event = await eventPromise;

                            expect(event.detail.countries).to.deep.equal(['KR']);
                            expect(event.bubbles).to.be.true;
                            expect(event.composed).to.be.true;
                        });

                        it('updates selectedCountries and countries property on apply', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;
                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;

                            const usCheckbox = el.shadowRoot.querySelector('sp-checkbox[value="US"]');
                            usCheckbox.checked = true;
                            usCheckbox.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                            await el.updateComplete;

                            const applyButton = [...el.shadowRoot.querySelectorAll('sp-button[slot="button"]')].find(
                                (b) => b.textContent.trim() === 'Apply',
                            );
                            applyButton.click();
                            await el.updateComplete;

                            expect(el.selectedCountries).to.deep.equal(['US']);
                            expect(el.countries).to.equal('US');
                            expect(el.dialogOpen).to.be.false;
                        });

                        it('deduplicates countries on apply', async function () {
                            const el = initElementFromTemplate('noCountries', this.test.title);
                            await el.updateComplete;

                            el.shadowRoot.querySelector('.selection-trigger').click();
                            await el.updateComplete;

                            el.tempSelectedCountries = ['KR', 'KR', 'JP'];
                            await el.updateComplete;

                            const applyButton = [...el.shadowRoot.querySelectorAll('sp-button[slot="button"]')].find(
                                (b) => b.textContent.trim() === 'Apply',
                            );
                            applyButton.click();
                            await el.updateComplete;

                            expect(el.selectedCountries).to.deep.equal(['KR', 'JP']);
                        });
                    });
                });
            });
        </script>
    </head>

    <body>
        <main>
            <sp-theme system="spectrum-two" color="light" scale="medium">
                <div class="test-section">
                    <h2>mas-country-picker Test Fixtures</h2>

                    <div class="test-item">
                        <template id="withCountries">
                            <mas-country-picker countries="KR,JP"></mas-country-picker>
                        </template>
                    </div>

                    <div class="test-item">
                        <template id="withWhitespace">
                            <mas-country-picker countries=" us , de "></mas-country-picker>
                        </template>
                    </div>

                    <div class="test-item">
                        <template id="noCountries">
                            <mas-country-picker selection-label="Select countries"></mas-country-picker>
                        </template>
                    </div>

                    <div class="test-item">
                        <template id="withEmptyLabel">
                            <mas-country-picker
                                empty-selection-label="All countries"
                                selection-label="Select countries"
                            ></mas-country-picker>
                        </template>
                    </div>

                    <div class="test-item">
                        <template id="emptySelectionIsValue">
                            <mas-country-picker
                                empty-selection-label="All countries"
                                empty-selection-is-value
                            ></mas-country-picker>
                        </template>
                    </div>

                    <div class="test-item">
                        <template id="disabled">
                            <mas-country-picker disabled selection-label="Select countries"></mas-country-picker>
                        </template>
                    </div>
                </div>
            </sp-theme>
        </main>
    </body>
</html>
